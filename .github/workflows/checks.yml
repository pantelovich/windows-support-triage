name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  powershell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install check dependencies
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
      - name: Lint and unit tests
        run: |
          if ($IsWindows) { ./scripts/Test-Project.ps1 -WindowsSmoke }
          else { ./scripts/Test-Project.ps1 }
